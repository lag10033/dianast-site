const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function go() {
  const пароль = document.getElementById('p').value;
  const e = document.getElementById('e');
  e.textContent = 'Открываю…';
  try {
    const км = await crypto.subtle.importKey('raw',
      new TextEncoder().encode(пароль), 'PBKDF2', false, ['deriveKey']);
    const ключ = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b2a(SALT), iterations:ИТ, hash:'SHA-256'},
      км, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const открыто = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:b2a(NONCE)}, ключ, b2a(DATA));
    if (document.getElementById('z').checked)
      localStorage.setItem('dg_pw', пароль);
    document.open(); document.write(new TextDecoder().decode(открыто)); document.close();
  } catch (err) {
    e.textContent = 'Неверный пароль';
    localStorage.removeItem('dg_pw');
  }
}
window.addEventListener('load', () => {
  const с = localStorage.getItem('dg_pw');
  if (с) { document.getElementById('p').value = с; go(); }
});
document.getElementById('p').addEventListener('keydown',
  ev => { if (ev.key === 'Enter') go(); });
